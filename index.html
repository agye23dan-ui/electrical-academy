<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Electrical Academy - Interactive NVTI General Electrical Certificate One & Two study companion with interactive circuits, simulators, trade calculators, and mock exams.">
<meta name="theme-color" content="#0a0f1d">
<title>Electrical Academy ⚡ NVTI Cert 1 & 2 Master Suite</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;

  /* Daylight Theme (Clean Ice Slate) */
  --bg: #f8fafc;
  --bg-subtle: #f1f5f9;
  --card: #ffffff;
  --card-hover: #fcfdfe;
  --glass: rgba(255, 255, 255, 0.88);
  --glass-border: rgba(226, 232, 240, 0.85);
  --ink: #0f172a;
  --ink-secondary: #334155;
  --mut: #64748b;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;

  /* Electrical Accents */
  --cold: #0284c7;
  --cold-hover: #0369a1;
  --cold-glow: rgba(2, 132, 199, 0.15);
  --cold-subtle: rgba(2, 132, 199, 0.08);
  --hot: #ef4444;
  --hot-subtle: rgba(239, 68, 68, 0.1);
  --cu: #d97706;
  --cu-subtle: rgba(217, 119, 6, 0.12);
  --ok: #10b981;
  --ok-subtle: rgba(16, 185, 129, 0.12);
  --gold: #f59e0b;

  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 4px 16px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 16px 32px -6px rgba(15, 23, 42, 0.1);
  --shadow-glow: 0 0 25px rgba(2, 132, 199, 0.18);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
}

[data-theme="dark"], @media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090e17;
    --bg-subtle: #0f1726;
    --card: #131c2d;
    --card-hover: #172338;
    --glass: rgba(19, 28, 45, 0.88);
    --glass-border: rgba(255, 255, 255, 0.08);
    --ink: #f8fafc;
    --ink-secondary: #e2e8f0;
    --mut: #94a3b8;
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.16);

    --cold: #38bdf8;
    --cold-hover: #7dd3fc;
    --cold-glow: rgba(56, 189, 248, 0.22);
    --cold-subtle: rgba(56, 189, 248, 0.12);
    --hot: #f87171;
    --hot-subtle: rgba(248, 113, 113, 0.15);
    --cu: #fbbf24;
    --cu-subtle: rgba(251, 191, 36, 0.14);
    --ok: #34d399;
    --ok-subtle: rgba(52, 211, 153, 0.15);
    --gold: #fbbf24;

    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 8px 24px -4px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 20px 40px -8px rgba(0, 0, 0, 0.7);
    --shadow-glow: 0 0 30px rgba(56, 189, 248, 0.2);
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: var(--font-sans);
  background-color: var(--bg);
  color: var(--ink);
  line-height: 1.65;
  font-size: 15.5px;
  min-height: 100vh;
  padding-bottom: 80px;
  background-image: radial-gradient(circle at 50% 0%, var(--cold-subtle) 0%, transparent 60%);
  background-attachment: fixed;
  transition: background-color 0.25s ease, color 0.25s ease;
}

/* =====================================================================
   App Header & Navigation
===================================================================== */
.header-wrap {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  background: var(--glass);
  border-bottom: 1px solid var(--glass-border);
  transition: all 0.2s ease;
}

header {
  max-width: 1440px;
  margin: 0 auto;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--ink);
  text-decoration: none;
  font-weight: 800;
  font-size: 1.15rem;
  letter-spacing: -0.02em;
}

.brand-icon {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: linear-gradient(135deg, #0ea5e9, #0284c7);
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 1.1rem;
  box-shadow: 0 2px 8px var(--cold-glow);
}

.brand-meta {
  display: flex;
  flex-direction: column;
}

.brand-meta span.sub {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--mut);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-top: -3px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  background: var(--bg-subtle);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 10px;
  width: 38px;
  height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}

.icon-btn:hover {
  background: var(--card);
  border-color: var(--cold);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}

.streak-pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--cu-subtle);
  color: var(--cu);
  border: 1px solid rgba(217, 119, 6, 0.25);
  padding: 6px 12px;
  border-radius: 99px;
  font-size: 0.82rem;
  font-weight: 700;
  font-family: var(--font-mono);
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s ease;
}
.streak-pill-btn:hover { transform: translateY(-1px); background: var(--cu); color: #fff; }

.progress-pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--cold-subtle);
  color: var(--cold);
  border: 1px solid var(--cold-glow);
  padding: 6px 12px;
  border-radius: 99px;
  font-size: 0.82rem;
  font-weight: 700;
  font-family: var(--font-mono);
  cursor: pointer;
  transition: all 0.2s ease;
}

.progress-pill-btn:hover {
  background: var(--cold);
  color: #fff;
  transform: translateY(-1px);
}

/* =====================================================================
   Sidebar & Wide App Shell Layout
===================================================================== */
.app-layout {
  max-width: 1440px;
  margin: 0 auto;
  display: flex;
  gap: 24px;
  padding: 18px 20px;
  position: relative;
}

.sidebar {
  width: 300px;
  flex-shrink: 0;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px 10px;
  height: calc(100vh - 96px);
  position: sticky;
  top: 76px;
  overflow-y: auto;
  scrollbar-width: thin;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 30;
}

.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 12px 14px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 8px;
}

.sidebar-title {
  font-size: 0.76rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--mut);
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sidebar-group-title {
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--mut);
  padding: 14px 10px 4px;
}

.sidebar-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  text-decoration: none;
  color: var(--ink-secondary);
  font-size: 0.85rem;
  font-weight: 600;
  transition: all 0.15s ease;
}

.sidebar-link:hover {
  background: var(--bg-subtle);
  color: var(--cold);
}

.sidebar-link.active {
  background: var(--cold-subtle);
  color: var(--cold);
  border-left: 3px solid var(--cold);
  font-weight: 700;
}

.sidebar-link .mod-code {
  font-family: var(--font-mono);
  font-size: 0.76rem;
  padding: 3px 6px;
  border-radius: 5px;
  background: var(--bg-subtle);
  color: var(--cold);
  font-weight: 700;
  min-width: 44px;
  text-align: center;
}

.sidebar-link.active .mod-code {
  background: var(--cold);
  color: #fff;
}

.sidebar-link .mod-name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 0.85rem;
}

.sidebar-link .status-dot {
  font-size: 0.75rem;
  font-family: var(--font-mono);
  font-weight: 700;
  white-space: nowrap;
}

.sidebar-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  z-index: 80;
  display: none;
}

.sidebar-search {
  padding: 0 4px 10px;
}

.sidebar-search input {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  color: var(--ink);
  font-size: 0.82rem;
  font-family: inherit;
  outline: none;
  transition: all 0.15s ease;
}

.sidebar-search input:focus {
  border-color: var(--cold);
  background: var(--card);
  box-shadow: 0 0 0 3px var(--cold-glow);
}

@media (max-width: 1024px) {
  body.sidebar-open .sidebar-backdrop { display: block; }
  .sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 90;
    height: 100vh;
    border-radius: 0;
    transform: translateX(-100%);
    box-shadow: var(--shadow-lg);
  }
  body.sidebar-open .sidebar { transform: translateX(0); }
}

@media (min-width: 1025px) {
  body.sidebar-collapsed .sidebar {
    display: none;
  }
}

.content-wrap {
  flex: 1;
  min-width: 0;
}

main {
  max-width: 100%;
  margin: 0;
  padding: 0 0 48px;
  animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

h1, h2, h3, h4 {
  color: var(--ink);
  letter-spacing: -0.025em;
  font-weight: 800;
  line-height: 1.25;
}

h1 { font-size: 1.85rem; margin-bottom: 0.4em; }
h2 { font-size: 1.35rem; margin: 1.8em 0 0.8em; }
h3 { font-size: 1.15rem; color: var(--cold); margin: 1.4em 0 0.5em; }

p { margin-bottom: 1em; color: var(--ink-secondary); }

/* Breadcrumbs */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.86rem;
  margin-bottom: 18px;
  color: var(--mut);
}

.breadcrumb a {
  color: var(--cold);
  text-decoration: none;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.breadcrumb a:hover { text-decoration: underline; }

/* =====================================================================
   Wide Lesson Cards
===================================================================== */
.wide-lesson-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 5px solid var(--line-strong);
  border-radius: var(--radius-md);
  padding: 22px 26px;
  text-decoration: none;
  color: inherit;
  transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow-sm);
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}

.wide-lesson-card.status-mastered { border-left-color: var(--gold); }
.wide-lesson-card.status-passed { border-left-color: var(--ok); }
.wide-lesson-card.status-warn { border-left-color: var(--cu); }
.wide-lesson-card.status-unstarted { border-left-color: var(--line-strong); }

.wide-lesson-card:hover {
  border-color: var(--cold);
  border-left-width: 7px;
  transform: translateY(-2px);
  box-shadow: var(--shadow-md), var(--shadow-glow);
  background: var(--card-hover);
}

.wide-lesson-card.status-mastered:hover { border-left-color: var(--gold); }
.wide-lesson-card.status-passed:hover { border-left-color: var(--ok); }
.wide-lesson-card.status-warn:hover { border-left-color: var(--hot); }

.wlc-left {
  flex: 1;
  min-width: 0;
}

.wlc-badge-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.wlc-syllabus-pill {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--mut);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.wlc-title {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--ink);
  margin-bottom: 6px;
  line-height: 1.35;
}

.wlc-desc {
  font-size: 0.88rem;
  color: var(--ink-secondary);
  margin-bottom: 10px;
  line-height: 1.5;
}

.wlc-meta {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 0.8rem;
  color: var(--mut);
  font-weight: 600;
}

.wlc-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
  flex-shrink: 0;
}

.wlc-action-btn {
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--cold);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

@media (max-width: 680px) {
  .wide-lesson-card {
    flex-direction: column;
    align-items: flex-start;
    padding: 16px 18px;
    gap: 12px;
  }
  .wlc-right {
    width: 100%;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }
}

/* Hero Progress Banner */
.hero-banner {
  background: linear-gradient(135deg, rgba(2, 132, 199, 0.12), rgba(217, 119, 6, 0.08));
  border: 1px solid var(--cold-glow);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 28px;
  box-shadow: var(--shadow-md);
  position: relative;
  overflow: hidden;
}

.hero-banner::after {
  content: '⚡';
  position: absolute;
  right: -10px;
  bottom: -25px;
  font-size: 8rem;
  opacity: 0.05;
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 2;
}

.hero-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 16px;
}

.hero-title {
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--ink);
  margin-bottom: 4px;
}

.hero-desc {
  color: var(--mut);
  font-size: 0.95rem;
  max-width: 680px;
  margin: 0;
}

.hero-progress-track {
  height: 10px;
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  border-radius: 99px;
  overflow: hidden;
  margin: 16px 0 10px;
}

.hero-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--cold), var(--ok));
  border-radius: 99px;
  transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Category Filter Tabs */
.filter-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px 14px;
  margin-bottom: 12px;
  scrollbar-width: none;
}
.filter-tabs::-webkit-scrollbar { display: none; }

.tab-btn {
  padding: 8px 16px;
  border-radius: 99px;
  background: var(--bg-subtle);
  color: var(--mut);
  border: 1px solid var(--line);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.18s ease;
}

.tab-btn:hover {
  color: var(--ink);
  border-color: var(--cold);
}

.tab-btn.active {
  background: var(--cold);
  color: #fff;
  border-color: var(--cold);
  box-shadow: 0 2px 8px var(--cold-glow);
}

.modules-grid {
  display: flex;
  flex-direction: column;
}

/* Standard Cards */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  margin: 14px 0;
  box-shadow: var(--shadow-sm);
  transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}

a.card {
  display: block;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}

a.card:hover, a.card:focus-visible {
  border-color: var(--cold);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md), var(--shadow-glow);
  background: var(--card-hover);
}

/* Pills & Badges */
.pill {
  font-size: 0.8rem;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 99px;
  background: var(--bg-subtle);
  color: var(--mut);
  border: 1px solid var(--line);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.pill.ok {
  background: var(--ok-subtle);
  color: var(--ok);
  border-color: rgba(16, 185, 129, 0.3);
}

.pill.gold {
  background: var(--cu-subtle);
  color: var(--gold);
  border-color: rgba(245, 158, 11, 0.3);
}

.pill.warn {
  background: var(--hot-subtle);
  color: var(--hot);
  border-color: rgba(239, 68, 68, 0.3);
}

.module-code-badge {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 700;
  padding: 6px 10px;
  border-radius: 8px;
  background: var(--cold-subtle);
  color: var(--cold);
  border: 1px solid var(--cold-glow);
  min-width: 54px;
  text-align: center;
}

/* Buttons */
button, .btn {
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  background: var(--cold);
  color: #ffffff;
  border: 0;
  border-radius: 10px;
  padding: 10px 20px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 2px 6px var(--cold-glow);
  text-decoration: none;
}

button:hover, .btn:hover {
  background: var(--cold-hover);
  transform: translateY(-1px);
  box-shadow: 0 4px 14px var(--cold-glow);
}

button:active, .btn:active { transform: translateY(0); }

button.secondary, .btn.secondary {
  background: var(--bg-subtle);
  color: var(--ink);
  border: 1px solid var(--line);
  box-shadow: none;
}
button.secondary:hover, .btn.secondary:hover {
  background: var(--card);
  border-color: var(--cold);
}

button:focus-visible, input:focus-visible, label:focus-within {
  outline: 2px solid var(--cold);
  outline-offset: 2px;
}

/* Quiz Experience 2.0 */
.quiz-container { margin-top: 24px; }
.q {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s ease;
}
.q-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--mut);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.q-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 16px;
  line-height: 1.45;
}
.q-options { display: flex; flex-direction: column; gap: 10px; }
.q-opt {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  cursor: pointer;
  transition: all 0.16s ease;
  user-select: none;
}
.q-opt:hover { background: var(--card); border-color: var(--cold); }
.q-opt input[type="radio"] { display: none; }
.opt-badge {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--card);
  border: 1.5px solid var(--line-strong);
  display: grid;
  place-items: center;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--mut);

/* Drawing colour code: live/L1 brown, neutral blue (.c), earth green with yellow dashes (.e), L2 black, L3 grey */
:root { --live: #92400e; --p3: #64748b; --earth: #16a34a; --earthy: #facc15; }
:root[data-theme="dark"] { --live: #d97706; --p3: #94a3b8; --earth: #4ade80; }

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const app = $('#app');

// Local storage progress store
let P = {};
try { P = JSON.parse(localStorage.getItem('ela') || '{}'); } catch(e) {}
P.sig = P.sig || {};
P.streak = P.streak || 0;
P.lastDaily = P.lastDaily || '';

const save = () => {
  try { localStorage.setItem('ela', JSON.stringify(P)); } catch(e) {}
  updateHeaderProgress();
  renderSidebar();
};

// Sound setting & Web Audio Synthesizer
let soundEnabled = localStorage.getItem('ela-sound') !== '0';
const updateSoundBtn = () => { const b = $('#btn-sound'); if(b) b.textContent = soundEnabled ? '🔊' : '🔇'; };
$('#btn-sound').onclick = () => {
  soundEnabled = !soundEnabled;
  localStorage.setItem('ela-sound', soundEnabled ? '1' : '0');
  updateSoundBtn();
  if(soundEnabled) playTone(587.33, 'sine', 0.1, 0.08);
};
updateSoundBtn();

let audioCtx = null;
function playTone(freq, type='sine', duration=0.1, gain=0.08) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(gain, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function playClick() { playTone(800, 'triangle', 0.04, 0.05); }
function playVictory() {
  if (!soundEnabled) return;
  [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
    setTimeout(() => playTone(f, 'sine', 0.25, 0.1), i * 90);
  });
}

// Theme management
const themeBtn = $('#btn-theme');
const applyTheme = (t) => {
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
};
let curTheme = localStorage.getItem('ela-theme') || 'auto';
applyTheme(curTheme);
themeBtn.onclick = () => {
  curTheme = curTheme === 'dark' ? 'light' : curTheme === 'light' ? 'auto' : 'dark';
  localStorage.setItem('ela-theme', curTheme);
  applyTheme(curTheme);
  playClick();
};

// Sidebar Toggle Drawer & Desktop Collapse
if (localStorage.getItem('ela-sidebar-collapsed') === '1') {
  document.body.classList.add('sidebar-collapsed');
}

window.toggleSidebar = () => {
  if (window.innerWidth <= 1024) {
    document.body.classList.toggle('sidebar-open');
  } else {
    document.body.classList.toggle('sidebar-collapsed');
    localStorage.setItem('ela-sidebar-collapsed', document.body.classList.contains('sidebar-collapsed') ? '1' : '0');
  }
  playClick();
};
window.closeSidebarDrawer = () => {
  document.body.classList.remove('sidebar-open');
};

// Canvas Confetti Generator
function fireConfetti() {
  const canvas = $('#confetti-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const particles = [];
  const colors = ['#0ea5e9', '#38bdf8', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'];
  for (let i = 0; i < 70; i++) {
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2 + 50,
      vx: (Math.random() - 0.5) * 16,
      vy: (Math.random() - 0.9) * 18,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360,
      vrot: (Math.random() - 0.5) * 12,
      life: 1
    });
  }
  const render = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let active = false;
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.45;
      p.vx *= 0.98;
      p.rot += p.vrot;
      p.life -= 0.012;
      if (p.life > 0) {
        active = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
        ctx.restore();
      }
    });
    if (active) requestAnimationFrame(render);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  };
  render();
}

// Data aggregation
const M = [];
if (window.Y && window.Y.mods) M.push(...Y.mods);
if (window.Z && window.Z.mods) M.push(...Z.mods);
if (window.fixModule) M.forEach(fixModule);
if (window.X) M.forEach(m => { const x = X[m.id]; if(x) { m.n += x.n; m.q = m.q.concat(x.q); } });
// City & Guilds lessons (ids start with 'cg') are tracked separately from the NVTI lessons.
const isCG = m => m.id.startsWith('cg');
const NV = M.filter(m => !isCG(m));

const D = [
  ['Compressor', 'Raises refrigerant pressure and temperature. Discharges hot high-pressure vapor.', 'h'],
  ['Condenser', 'Outdoor coil. Hot vapor releases heat to outside air and condenses into liquid.', 'h'],
  ['Expansion device', 'Capillary tube or TXV. Restricts flow, producing a steep pressure and temperature drop.', 'c'],
  ['Evaporator', 'Indoor coil. Cold refrigerant boils and absorbs heat from room air.', 'c']
];

const shuffle = a => {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.random() * (i + 1) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const best = k => P[k] != null ? P[k] : null;

const jobTotal = () => (window.Y && Y.jobs) ? Y.jobs.reduce((a, j) => a + j.steps.length, 0) : 1;
const jobDone = () => Object.values(P.j || {}).reduce((a, x) => a + (x || []).filter(Boolean).length, 0);
const jobPct = () => Math.round(jobDone() / (jobTotal() || 1) * 100);

  if (pEl) pEl.textContent = pct + '%';
  const sEl = $('#hdr-streak');
  if (sEl) sEl.textContent = P.streak || 0;
}

      };
      n.onclick = f;
      n.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') f(); };
    });
  }
  if (x === 'calc') {
    document.querySelectorAll('.card input').forEach(i => i.oninput = () => {
      const v = k => parseFloat($('#' + k).value);
      const a = v('a'), b = v('b'), c = v('c'), d = v('d');
      const sh = b - a, sc = c - d;
      $('#sh').textContent = isNaN(sh) ? 'Superheat: –' : `Superheat: ${sh.toFixed(1)} K`;
      $('#sc').textContent = isNaN(sc) ? 'Subcooling: –' : `Subcooling: ${sc.toFixed(1)} K`;
      let hint = '';
      if (!isNaN(sh) && sh < 3) hint += '⚠️ Very low superheat: risk of liquid floodback to compressor. ';
      if (!isNaN(sh) && sh > 15) hint += '⚠️ High superheat: undercharge or TXV restriction. ';
      if (!isNaN(sc) && sc < 3) hint += '⚠️ Low subcooling: possible refrigerant undercharge. ';
      if (!isNaN(sc) && sc > 12) hint += '⚠️ High subcooling: possible overcharge. ';
      $('#hint').textContent = hint;
    });
  }
}

function quiz(el, qs, key, opts) {
  qs = qs.map(q => {
    const o = shuffle(q[1].map((t, i) => [t, i === q[2]]));
    return [q[0], o.map(x => x[0]), o.findIndex(x => x[1]), q[3]];
  });

  el.innerHTML = qs.map((q, i) => `
    <div class="q" id="qcard-${i}">
      <div class="q-header">
        <span>Question ${i + 1} of ${qs.length}</span>
      </div>
      <div class="q-title">${q[0]}</div>
      <div class="q-options">
        ${q[1].map((o, j) => `
          <label class="q-opt" data-q="${i}" data-opt="${j}">
            <input type="radio" name="q${i}" value="${j}">
            <span class="opt-badge">${['A', 'B', 'C', 'D'][j] || (j + 1)}</span>
            <span style="font-weight:600;flex:1;">${o}</span>
          </label>
        `).join('')}
      </div>
      <div class="why" id="w${i}"></div>
    </div>
  `).join('') + `
    <div class="quiz-footer">
      <button id="chk" style="padding:14px 28px;font-size:1.05rem;width:100%;">Submit Answers</button>
      <div id="res"></div>
    </div>
  `;

  el.querySelectorAll('.q-opt').forEach(opt => {
    opt.onclick = () => {
      playClick();
      if ('vibrate' in navigator) navigator.vibrate(10);
      const qIdx = opt.dataset.q;
      el.querySelectorAll(`[data-q="${qIdx}"]`).forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
    };
  });

  $('#chk').onclick = () => {
    let s = 0;
    qs.forEach((q, i) => {
      const sel = el.querySelector(`input[name=q${i}]:checked`);
      const opts = el.querySelectorAll(`[data-q="${i}"]`);
      opts.forEach((lb, j) => {
        const inp = lb.querySelector('input');
        if (inp) inp.disabled = true;
        if (j === q[2]) lb.classList.add('good');
        else if (sel && +sel.value === j) lb.classList.add('bad');
      });
      if (sel && +sel.value === q[2]) s++;
      const whyEl = $('#w' + i);
      if (whyEl) {
        whyEl.innerHTML = `<b>Key Exam Insight:</b> ${q[3]}`;
        whyEl.classList.add('show');
      }
    });

    const p = Math.round(s / qs.length * 100);
    const passMark = (opts && opts.pass) || 70;
    const passed = p >= passMark;

    if (best(key) == null || p > best(key)) {
      P[key] = p;
      save();
    }

    if (passed) {
      fireConfetti();
      playVictory();
    }

    const retakeUrl = (opts && opts.retake) ? opts.retake : `#/${key.startsWith('exam') ? 'exam' + (key.length > 4 ? '/' + key.slice(4) : '') : 'm/' + key}`;

    $('#res').innerHTML = `
      <div class="score-card ${passed ? '' : 'fail'}">
        <span class="pill ${passed ? 'ok' : 'warn'}" style="font-size:0.9rem;">${passed ? '🎉 Passed' : '⚠️ Below ' + passMark + '%'}</span>
        <div class="score-num">${p}%</div>
        <p style="font-size:1.05rem;color:var(--ink-secondary);margin:4px 0 16px;">
          You answered <b>${s} of ${qs.length}</b> questions correctly.
          ${passed ? 'Excellent work! You meet the ' + ((opts && opts.bench) || 'NVTI Certificate') + ' benchmark.' : 'Review the study notes and practical schematics, then try again.'}
        </p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
          <a class="btn" href="${retakeUrl}" onclick="setTimeout(route)">🔄 Retake Quiz</a>
          <button class="secondary" onclick="filterReviewWrong()">🔍 Review Incorrect Only</button>
        </div>
      </div>
    `;

    $('#chk').remove();
    $('#res').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };
}

window.filterReviewWrong = () => {
  $$('.q').forEach(q => {
    const isBad = q.querySelector('.q-opt.bad');
    q.style.display = isBad ? 'block' : 'none';
  });
};

function initSigPad(jobIdx) {
  const c = document.getElementById('sig-pad-' + jobIdx);
  if (!c) return;
  const ctx = c.getContext('2d');
  c.width = c.offsetWidth || 360;
  c.height = 110;
  let drawing = false;

  const getPos = e => {
    const r = c.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - r.left, y: cy - r.top };
  };

  const start = e => {
    drawing = true;
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 2.5;
  };
  const move = e => {
    if (!drawing) return;
    const p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  };
  const stop = () => { drawing = false; };

  c.addEventListener('mousedown', start);
  c.addEventListener('mousemove', move);
  window.addEventListener('mouseup', stop);

  c.addEventListener('touchstart', e => { e.preventDefault(); start(e); }, { passive: false });
  c.addEventListener('touchmove', e => { e.preventDefault(); move(e); }, { passive: false });
  c.addEventListener('touchend', stop);
}

window.clearSig = idx => {
  const c = document.getElementById('sig-pad-' + idx);
  if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height);
};

window.saveSig = idx => {

  job(idx);
};

    return {
      x: (clientX - r.left) * (c.width / r.width),
      y: (clientY - r.top) * (c.height / r.height)
    };
  };

  const start = e => {
    drawing = true;
    const p = getPos(e);

    ctx.moveTo(p.x, p.y);

    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  };

  const move = e => {
    if (!drawing) return;
    const p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  };

  const stop = () => { drawing = false; };

  c.addEventListener('mousedown', start);
  c.addEventListener('mousemove', move);

  c.addEventListener('touchstart', e => { e.preventDefault(); start(e); }, { passive: false });

}

window.toggleSwitchA = () => {

};

window.toggleSwitchB = () => {
  swB = swB === 0 ? 1 : 0;

function renderTwoWay() {
  const isClosed = swA === swB;
  const bladeA = $('#blade-a');
  const bladeB = $('#blade-b');
  const lamp = $('#lamp-circle');
  const pill = $('#lamp-state-pill');
  const banner = $('#sim-status-banner');
  const feed = $('#feed-lamp');
  const strap1 = $('#strap-1');
  const strap2 = $('#strap-2');

  if (bladeA) bladeA.setAttribute('d', swA === 0 ? 'M125 110 L 190 80' : 'M125 110 L 190 140');
  if (bladeB) bladeB.setAttribute('d', swB === 0 ? 'M395 110 L 330 80' : 'M395 110 L 330 140');
  const lbl = v => v === 0 ? 'COM to L1' : 'COM to L2';
  if ($('#pos-a')) $('#pos-a').textContent = lbl(swA);
  if ($('#pos-b')) $('#pos-b').textContent = lbl(swB);
  // the strapper fed by Switch A's selected terminal is live, so the matching terminal on Switch B is live too
  const live = '#d97706', off = 'var(--ink)';
  [['#term-a1', swA === 0], ['#term-a2', swA === 1], ['#term-b1', swA === 0], ['#term-b2', swA === 1]].forEach(([id, on]) => { const t = $(id); if (t) t.setAttribute('fill', on ? live : off); });

  if (isClosed) {
    if (lamp) lamp.setAttribute('fill', '#facc15');
    if (pill) { pill.textContent = 'Lamp: ON'; pill.className = 'pill ok'; }
    if (feed) feed.setAttribute('stroke', '#d97706');
    if (strap1) strap1.setAttribute('stroke', swA === 0 ? '#d97706' : 'var(--ink)');
    if (strap2) strap2.setAttribute('stroke', swA === 1 ? '#d97706' : 'var(--ink)');
    if (banner) {
      banner.style.background = 'var(--ok-subtle)';
      banner.style.color = 'var(--ok)';
      banner.textContent = `⚡ Circuit Closed via Strapper ${swA + 1} (L${swA + 1} to L${swA + 1}): Lamp is Energised (230V).`;
    }
  } else {
    if (lamp) lamp.setAttribute('fill', 'var(--bg-subtle)');
    if (pill) { pill.textContent = 'Lamp: OFF'; pill.className = 'pill'; }
    if (feed) feed.setAttribute('stroke', 'var(--ink)');
    if (strap1) strap1.setAttribute('stroke', swA === 0 ? '#d97706' : 'var(--ink)');
    if (strap2) strap2.setAttribute('stroke', swA === 1 ? '#d97706' : 'var(--ink)');
    if (banner) {
      banner.style.background = 'var(--bg-subtle)';
      banner.style.color = 'var(--mut)';
      banner.textContent = `⭕ Circuit Open: Switch A uses L${swA + 1} but Switch B uses L${swB + 1}, so the lamp is de-energised (0V).`;
    }
  }
}

let userIsoSeq = [];
let availableIsoSteps = [];

function initIsoSequencer() {
  userIsoSeq = [];

}

function renderIsoUI() {
  const pool = $('#iso-pool');
  const seq = $('#iso-seq');
  if (!pool || !seq) return;

  pool.innerHTML = availableIsoSteps.map(s => `
    <button class="secondary" style="text-align:left;font-size:0.85rem;padding:8px 12px;" onclick="addIsoStep(${s.id})">
      ➕ ${s.text}
    </button>
  `).join('') || '<p style="color:var(--mut);font-size:0.85rem;">All steps selected.</p>';

  seq.innerHTML = userIsoSeq.map((s, i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-subtle);border:1px solid var(--line);border-radius:6px;font-size:0.85rem;">

}

window.addIsoStep = id => {
  const step = availableIsoSteps.find(s => s.id === id);
  if (!step) return;
  playClick();
  userIsoSeq.push(step);
  availableIsoSteps = availableIsoSteps.filter(s => s.id !== id);
  renderIsoUI();
};

window.checkIsoSeq = () => {
  const res = $('#iso-res');
  if (userIsoSeq.length < 6) {
    res.innerHTML = `<div class="note" style="border-color:var(--hot);background:var(--hot-subtle);">Please place all 6 steps before verifying.</div>`;
    return;
  }

  let correct = true;
  for (let i = 0; i < 6; i++) {
    if (userIsoSeq[i].id !== i + 1) { correct = false; break; }
  }

  if (correct) {
    fireConfetti();
    playVictory();
    res.innerHTML = `
      <div class="note" style="border-color:var(--ok);background:var(--ok-subtle);color:var(--ok);font-weight:700;">
        🎉 Flawless! You have mastered the NVTI & International Safe Isolation Protocol. Ready for workshop safety assessment!
      </div>
    `;
  } else {
    playTone(200, 'sawtooth', 0.25, 0.1);
    let critique = 'Safety sequencing error detected. Remember: ';
    const testIdx = userIsoSeq.findIndex(s => s.id === 5);
    const proveBefore = userIsoSeq.findIndex(s => s.id === 4);
    if (testIdx < proveBefore) critique += 'You CANNOT test conductors dead before proving your tester on a known source first! ';
    const reprove = userIsoSeq.findIndex(s => s.id === 6);
    if (reprove !== 5) critique += 'You must always re-prove your tester as the very last step. ';
    res.innerHTML = `<div class="note" style="border-color:var(--hot);background:var(--hot-subtle);color:var(--hot);font-weight:700;">⚠️ ${critique}</div>`;
  }
};

window.clearOhm = () => {

window.calcOhm = () => {
  let v = parseFloat($('#ow-v').value);
  let i = parseFloat($('#ow-i').value);
  let r = parseFloat($('#ow-r').value);
  let p = parseFloat($('#ow-p').value);

  const count = [v, i, r, p].filter(x => !isNaN(x)).length;
  if (count < 2) {
    $('#ow-res').innerHTML = `<span style="color:var(--hot);">Please input at least 2 values to calculate.</span>`;
    return;
  }

  if (!isNaN(v) && !isNaN(i)) { r = v / i; p = v * i; }
  else if (!isNaN(v) && !isNaN(r)) { i = v / r; p = (v * v) / r; }
  else if (!isNaN(v) && !isNaN(p)) { i = p / v; r = (v * v) / p; }
  else if (!isNaN(i) && !isNaN(r)) { v = i * r; p = (i * i) * r; }
  else if (!isNaN(i) && !isNaN(p)) { v = p / i; r = p / (i * i); }
  else if (!isNaN(r) && !isNaN(p)) { v = Math.sqrt(p * r); i = Math.sqrt(p / r); }

  $('#ow-v').value = v.toFixed(2);
  $('#ow-i').value = i.toFixed(2);
  $('#ow-r').value = r.toFixed(2);
  $('#ow-p').value = p.toFixed(2);

  $('#ow-res').innerHTML = `
    <div style="background:var(--bg-subtle);padding:12px;border-radius:8px;border-left:3px solid var(--cold);">
      <b>Solution:</b> Voltage: <b>${v.toFixed(2)} V</b> | Current: <b>${i.toFixed(2)} A</b> | Resistance: <b>${r.toFixed(2)} Ω</b> | Power: <b>${p.toFixed(2)} W</b>
    </div>
  `;
  playClick();
};

window.calcVd = () => {
  const v = parseFloat($('#vd-v').value);
  const l = parseFloat($('#vd-l').value);
  const i = parseFloat($('#vd-i').value);
  const mv = parseFloat($('#vd-size').value);
  const lim = parseFloat($('#vd-cat').value);

  const vd = (mv * i * l) / 1000;
  const pct = (vd / v) * 100;
  const maxVd = (lim / 100) * v;
  const pass = vd <= maxVd;

  $('#vd-res').innerHTML = `
    <div class="note" style="border-color:${pass ? 'var(--ok)' : 'var(--hot)'};background:${pass ? 'var(--ok-subtle)' : 'var(--hot-subtle)'};">
      <div style="font-size:1.1rem;font-weight:800;color:${pass ? 'var(--ok)' : 'var(--hot)'};">
        ${pass ? 'COMPLIANT WITH REGULATIONS ✓' : 'NON-COMPLIANT: EXCESSIVE VOLTAGE DROP ⚠️'}
      </div>
      <div style="margin-top:6px;font-size:0.92rem;color:var(--ink);">
        Calculated Voltage Drop: <b>${vd.toFixed(2)} V (${pct.toFixed(2)}%)</b><br>
        Permitted Max (${lim}% limit): <b>${maxVd.toFixed(2)} V</b><br>
        ${pass ? 'Conductor size is adequate for this run length.' : 'Increase cable size to the next standard gauge (e.g. 4.0 mm² or 6.0 mm²) to lower resistance.'}
      </div>
    </div>
  `;
  playClick();
};

window.calcConduit = () => {
  const cap = parseFloat($('#cs-size').value);
  const c15 = parseInt($('#cs-15').value || '0', 10);
  const c25 = parseInt($('#cs-25').value || '0', 10);
  const c40 = parseInt($('#cs-40').value || '0', 10);

  const load = (c15 * 31) + (c25 * 43) + (c40 * 58);
  const pct = Math.round((load / cap) * 100);
  const pass = load <= cap;

  $('#cs-res').innerHTML = `
    <div class="note" style="border-color:${pass ? 'var(--ok)' : 'var(--hot)'};background:${pass ? 'var(--ok-subtle)' : 'var(--hot-subtle)'};">
      <div style="font-weight:800;color:${pass ? 'var(--ok)' : 'var(--hot)'};">
        Conduit Capacity: ${load} / ${cap} units (${pct}%) — ${pass ? 'COMPLIANT' : 'OVERFILLED!'}
      </div>
      <div style="margin-top:4px;font-size:0.9rem;">
        ${pass ? 'Cables fill does not exceed the 40% space factor limit. Easy drawing-in guaranteed.' : 'Violates 40% rule. High risk of cable jams and sheath rupture during pulling. Select larger conduit.'}
      </div>
    </div>
  `;
  playClick();
};

window.calcResistor = () => {
  const b1 = $('#rc-b1').value;
  const b2 = $('#rc-b2').value;
  const m = parseFloat($('#rc-m').value);
  const t = $('#rc-t').value;

  const val = parseInt(b1 + b2, 10) * m;
  let txt = val >= 1000000 ? (val / 1000000) + ' MΩ' : val >= 1000 ? (val / 1000) + ' kΩ' : val + ' Ω';
  $('#rc-res').textContent = `${txt} ±${t}%`;
};

  quiz($('#qz'), drillQs, 'daily_temp');

  if (oldChk) {

    oldChk.onclick = () => {
      origClick();

const searchModal = $('#search-modal');
const searchBox = $('#search-box');
const searchList = $('#search-list');

function openSearch() {
  searchModal.classList.add('open');
  searchBox.value = '';
  renderSearchResults('');
  setTimeout(() => searchBox.focus(), 50);
}

function closeSearch() { searchModal.classList.remove('open'); }

$('#btn-search').onclick = openSearch;
$('#search-close').onclick = closeSearch;
searchModal.onclick = e => { if (e.target === searchModal) closeSearch(); };

window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openSearch(); }
  if (e.key === 'Escape' && searchModal.classList.contains('open')) closeSearch();
});

function renderSearchResults(q) {
  q = q.trim().toLowerCase();
  const results = [];

  M.forEach(m => {
    if (!q || m.t.toLowerCase().includes(q) || m.id.toLowerCase().includes(q) || m.s.toLowerCase().includes(q)) {
      results.push({ title: `${m.id.toUpperCase()}: ${m.t}`, sub: m.s, url: `#/m/${m.id}`, type: 'Module' });
    }
  });

  if (window.Y && Y.jobs) {
    Y.jobs.forEach((j, i) => {
      if (!q || j.t.toLowerCase().includes(q) || j.tools.toLowerCase().includes(q)) {
        results.push({ title: j.t, sub: `Tools: ${j.tools}`, url: `#/job/${i}`, type: 'Job Sheet' });
      }
    });
  }

  results.push(
    { title: 'House Wiring Practice', sub: 'Choose rooms, wire the house, switch on, see RCD and MCB trips', url: '#/house', type: 'Simulator' },
    { title: 'Two-Way Switching Circuit Simulator', sub: 'Interactive toggle bench', url: '#/sims', type: 'Simulator' },
    { title: 'Safe Isolation Protocol Sequencer', sub: '6-step isolation safety tool', url: '#/sims', type: 'Simulator' },
    { title: 'City & Guilds 2365 Level 2 and Level 3 track', sub: 'Units 201 to 210 and 301 to 308, with unit tests', url: '#/cg', type: 'City & Guilds' },
    { title: 'Intermediate Switching Simulator', sub: 'Control one lamp from three places', url: '#/sims', type: 'Simulator' },
    { title: 'DOL Motor Starter Simulator', sub: 'Start, stop, hold-in, overload, no-volt release', url: '#/sims', type: 'Simulator' },
    { title: 'Star-Delta Starting Sequence', sub: 'Contactors, current and speed', url: '#/sims', type: 'Simulator' },
    { title: 'Series-Parallel Circuit Lab', sub: 'Voltage, current and power', url: '#/sims', type: 'Simulator' },
    { title: 'Earth Fault Loop Impedance Checker', sub: 'Zs against MCB type and rating', url: '#/sims', type: 'Simulator' },
    { title: 'RCD Trip Tester', sub: '1/2, 1 and 5 times I-delta-n tests', url: '#/sims', type: 'Simulator' },
    { title: 'Power Factor Correction Simulator', sub: 'Capacitor kVAr and current saved', url: '#/sims', type: 'Simulator' },
    { title: 'Logic Gate Lab', sub: 'Gates and truth tables', url: '#/sims', type: 'Simulator' },
    { title: 'AC and Three-Phase Waveform Lab', sub: 'RMS, peak, frequency, 120 degree phases', url: '#/sims', type: 'Simulator' },
    { title: 'Transformer Lab', sub: 'Turns ratio, voltage and current', url: '#/sims', type: 'Simulator' },
    { title: 'Ohm\'s Law & Power Wheel Calculator', sub: 'Solve V, I, R, P', url: '#/tools', type: 'Toolkit' },
    { title: 'Cable Sizing & Voltage Drop Calculator', sub: 'Regulations check (3% & 5%)', url: '#/tools', type: 'Toolkit' },
    { title: 'Conduit Space Factor (40% rule)', sub: 'Cable fill capacity checker', url: '#/tools', type: 'Toolkit' },
    { title: 'Active Recall Smart Flashcards', sub: 'Symbols, formulas & rules', url: '#/flashcards', type: 'Flashcards' }
  );

  const matched = results.filter(r => !q || r.title.toLowerCase().includes(q) || r.sub.toLowerCase().includes(q));

  if (!matched.length) {
    searchList.innerHTML = `<p style="padding:20px;text-align:center;color:var(--mut);">No matching modules or topics found.</p>`;
    return;
  }

  searchList.innerHTML = matched.slice(0, 15).map(r => `
    <a class="search-item" href="${r.url}" onclick="closeSearch()">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b>${r.title}</b>
        <span class="pill" style="font-size:0.75rem;">${r.type}</span>
      </div>
      <div style="font-size:0.8rem;color:var(--mut);margin-top:2px;">${r.sub}</div>
    </a>
  `).join('');
}

searchBox.oninput = () => renderSearchResults(searchBox.value);

// =====================================================================
// Router
// =====================================================================
function route() {
  clearInterval(window.T);
  const h = location.hash.split('/');
  window.scrollTo(0, 0);
  renderSidebar();

  if (h[1] === 'm') mod(h[2]);
  else if (h[1] === 'exam') exam(h[2]);
  else if (h[1] === 'cg') cgHub();
  else if (h[1] === 'cgexam') cgExam(h[2]);
  else if (h[1] === 'jobs') jobs();
  else if (h[1] === 'draw') draw();
  else if (h[1] === 'job') job(+h[2]);
  else if (h[1] === 'sims') sims();
  else if (h[1] === 'house') houseView();
  else if (h[1] === 'tools') tools();
  else if (h[1] === 'flashcards') flashcards();
  else if (h[1] === 'daily') daily();
  else if (h[1] === 'cert') cert();
  else if (h[1] === 'report') report();
  else home();
}

addEventListener('hashchange', route);
route();

// Service Worker for offline PWA functionality
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
